# /etc/txtempus.conf
#
# Single source of truth for the txtempus appliance. This file is:
#   * sourced as KEY=VALUE by deploy/txtempus-scheduler.sh and txtempus-control.sh
#   * read/written by the web UI (web/txtempus-web.py)
#
# It is plain shell-sourceable KEY=VALUE so the bash scripts can `source` it with
# zero parsing and Python can read it with a 5-line splitter. Keep values simple
# (no spaces around `=`, no shell expansions you don't want evaluated).

# Station / region to transmit.
#   DCF77  - Germany / Europe   (77.5 kHz)
#   WWVB   - USA                (60   kHz)
#   MSF    - United Kingdom     (60   kHz)
#   JJY40  - Japan              (40   kHz)
#   JJY60  - Japan              (60   kHz)
STATION=DCF77

# Default transmit duration in minutes (clamped to 1..120).
RUN_DURATION=10

# Time-zone offset in minutes applied to the transmitted time (txtempus -z).
# 0 = use the Pi's local time. Used e.g. to drive a watch set to another zone.
ZONE_OFFSET=0

# Path to the installed binary. `make install` puts it in /usr/bin/txtempus.
# (This replaces the old hard-coded /home/mark/.../build/txtempus path.)
TXTEMPUS_PATH=/usr/bin/txtempus

# Nightly schedule: comma-separated HH:MM (24h) times to run automatically.
# These drive the systemd timer (via a generated drop-in). Empty = no times.
SCHEDULE_TIMES=01:59,02:59,03:59

# Whether the nightly schedule is active (true/false).
SCHEDULE_ENABLED=true

# Warn in the logs if CPU temperature exceeds this (°C) during a transmit.
TEMP_WARN_C=70

# --- Web UI (web/txtempus-web.py) ---------------------------------------------

# Interface and port the web UI binds to. On a trusted LAN 0.0.0.0 is fine;
# set to a specific interface IP to restrict it further.
WEB_BIND=0.0.0.0
WEB_PORT=8080

# Optional speed-bump PIN. If non-empty, mutating actions require this PIN
# (sent as the X-Txtempus-Pin header). Empty = open (acceptable on a private
# LAN). This is NOT a security boundary, just a guard against accidental clicks.
WEB_PIN=
